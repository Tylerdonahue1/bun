<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simmer · a warm little fight coach for two (prototype)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Clickable prototype: Simmer, with Bun the coach. Stop having the same fight. Fake data only.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF4E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,100,1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/shared/simmer.css">
<script type="module" src="/analytics.js"></script>
</head>
<body>
<a class="skip" href="#screen">Skip to app screen</a>
<div class="stage">
  <aside class="panel" aria-label="Prototype notes and screen menu">
    <div class="panel-brand">
      <span class="panel-bun" aria-hidden="true"></span>
      <div>
        <p class="panel-name">Simmer</p>
        <p class="panel-sub">Clickable prototype · fake data only</p>
      </div>
    </div>
    <p class="panel-note">A warm coach named <b>Bun</b> helps couples stop having the same fight. Nothing here signs you up, charges you, or sends messages.</p>
    <nav class="jump" aria-label="Jump to screen" id="jump-desktop"></nav>
    <fieldset class="demo-toggles" id="toggles-desktop"></fieldset>
  </aside>

  <main class="device-wrap">
    <div class="phone" id="phone">
      <div class="notch" aria-hidden="true"></div>
      <div class="offline-bar" id="offline-bar" role="status" hidden>You're offline. Cool-down and notes still work. Check-ins sync when you're back.</div>
      <div class="screen" id="screen" tabindex="-1"></div>
      <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
      <button class="quick-exit" id="quick-exit" type="button" hidden aria-label="Quick exit: leave this app now and open a weather page">Quick exit</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="sheet-scrim" id="scrim" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
    </div>
    <button class="jump-fab" id="jump-fab" type="button" aria-haspopup="dialog" aria-controls="jump-dialog">Screens</button>
  </main>
</div>

<dialog class="jump-dialog" id="jump-dialog" aria-label="Jump to any screen">
  <div class="jd-head"><p class="jd-title">Jump to a screen</p><button type="button" class="btn-ghost sm" id="jump-close">Close</button></div>
  <nav class="jump" id="jump-mobile" aria-label="Jump to screen (mobile)"></nav>
  <fieldset class="demo-toggles" id="toggles-mobile"></fieldset>
</dialog>
<div id="vswitch"></div>
<script src="/shared/simmer.js"></script>
<script src="app.js"></script>
</body>
</html>
